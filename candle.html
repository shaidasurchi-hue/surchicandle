<html lang="en">
<head>
  <title>surchi candle </title>
  <link rel="stylesheet" href="style.css">
</head>
<style>


  * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}


header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 20px;
  background: rgb(187, 176, 176);
  position: relative;
}

.logo {
  font-size: 100px;
  font-weight: bold;
  letter-spacing: 4px;
  
}

.candle {
  font-size: 30px;
  cursor: pointer;
  display: block;
}

.nav-menu {
  display: none;
  flex-direction: column;
  position: absolute;
  top: 60px;
  left: 0;
  width: 100%;
  background: rgb(14, 12, 12);
  border-top: 1px solid #ccc;
}

.nav-menu a {
  padding: 15px;
  text-decoration: none;
  color: rgb(19, 16, 16);
  border-bottom: 1px solid #eee;
}

.nav-menu a:hover {
  background: #f5f5f5;
}

/* On larger screens show menu horizontally */
@media (min-width: 768px) {
  .candle {
    display: none;
  }
  .nav-menu {
    display: flex;
    flex-direction: row;
    position: static;
    background: none;
    border: none;
    font-size: 30px;

  }
  .nav-menu a {
    border: none;
    padding: 0 20px;
  }

}
</style>
<body >


  <header>
    
    <div class="candle" id="candle">
    
    </div>

    
    <div class="logo"><center> surchi candle</center></div>

    <!-- Navigation Menu -->
   <center> <nav class="nav-menu" id="nav-menu">
      <a href="http://127.0.0.1:3000/candle.html?serverWindowId=7baa7efe-c051-41db-845a-d7942d518e9c"><b>Home</b></a>
      <a href="http://127.0.0.1:3000/price.html?serverWindowId=7baa7efe-c051-41db-845a-d7942d518e9c"><b>Price</b></a>
      <a href="http://127.0.0.1:3000/aboutus.html?serverWindowId=7baa7efe-c051-41db-845a-d7942d518e9c"><b>About Us</b></a>
      <a href="http://127.0.0.1:3000/contact us.html?serverWindowId=7baa7efe-c051-41db-845a-d7942d518e9c"><b>Contact</b></a>
    </nav></center> </header>   
   
  </header>
    
  <img src=" https://i.pinimg.com/1200x/7a/28/82/7a28828c4c5136cc3db05f48e6f46536.jpg" height="100%" width="100%">
  
  <script src="script.js">
    const candle = document.getElementById('candle');
const navMenu = document.getElementById('nav-menu');

candle.addEventListener('click', () => {
  navMenu.classList.toggle('active');
});
  </script>
  
</body>

</html>
